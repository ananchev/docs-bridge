[project]
name = "docs-bridge"
version = "0.1.0"
description = "docs-bridge RAG core: shared by the ingest-worker (Docling parse -> BGE-M3 embed -> Qdrant) and the docs-bridge server (hybrid search -> rerank -> MCP/REST)."
requires-python = ">=3.11"

# Base deps = everything the SHARED core needs (config, the ONNX/INT8 embedder,
# Qdrant access). Both images install this; the heavy, image-specific deps live in
# the extras below so each image stays lean:
#   ingest-worker  ->  .[ingest]   (Docling; torch arrives via Docling, CPU-only)
#   docs-bridge    ->  .[server]   (FastMCP + uvicorn; no torch, no Docling)
#
# Direct deps are pinned exactly here; the FULL transitive set is locked per image
# (images/*/requirements*.lock, regenerated by images/lock.sh). Images install the
# lock, then this package with --no-deps — a build never re-resolves.
#
# THE INVARIANT these pins protect (multi-user-rollout-plan §4.2): the embedder
# runtime and tokenizer (onnxruntime, tokenizers, numpy) must be IDENTICAL in the
# ingest-worker and the docs-bridge server images, on every host. The embedder
# model itself is not built from these pins at all: it is a frozen artifact
# (images/models/), so a runtime bump can never silently re-export a different
# model under 137k stored `teamcenter` vectors.
#
# Upgraded 2026-09-28 from the 2025-01 set (onnxruntime 1.20.1, tokenizers 0.19.1,
# numpy<2). A runtime bump like that one is gated by tools/eval/embed_upgrade_parity.py
# against the stored vectors (notes/phase-a-runbook.md) before any image ships.
dependencies = [
    "numpy==2.4.6",                     # newest line with py3.11 wheels (2.5 needs 3.12)
    "tokenizers==0.23.2",               # MUST be the same in both images, or query
                                        # vectors drift from doc vectors. 0.23.2 is what
                                        # transformers 5.17 (docling's chunker) resolves.
    "qdrant-client==1.12.1",            # unchanged: named dense + sparse vectors
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
# ingest-worker image: the Docling set is pinned as a SET (docling pins
# docling-slim exactly; core/parse/ibm-models are its matching releases). [rapidocr]
# = RapidOCR on onnxruntime, replacing torch EasyOCR. torch still arrives via
# docling-slim[standard]; it MUST come from the PyTorch CPU index — the PyPI
# linux/aarch64 wheel of torch 2.14 pulls ~15 nvidia-* CUDA packages (see lock.sh).
# The FlagEmbedding fallback backend was removed 2026-09-28.
ingest = [
    "docling[rapidocr]==2.130.0",       # PDF/HTML/DOCX/PPTX -> structure-aware chunks
    "docling-core[chunking]==2.99.0",   # HybridChunker; re-verify parse.py's API notes
    "docling-ibm-models==4.0.3",        # layout/table models loader
    "docling-parse==7.22.1",            # PDF backend
    "transformers==5.17.0",             # the chunker's token counter (parse.CHUNK_TOKENIZER)
    "torch==2.14.0",                    # CPU (+cpu wheel); Docling layout/table models
]

# docs-bridge server image: the MCP + REST surface. No torch/Docling at RUNTIME —
# query embedding + rerank go through onnxruntime against the baked INT8 models.
# Deliberately NOT moved in the 2026-09 upgrade (plan §9: a fastmcp major bump is
# its own branch). Pins validated by a local py3.11 framework smoke (2026-06-21):
# build_app mounts mcp.http_app(path="/mcp") + .lifespan, the bearer gate enforces
# 401 on REST+MCP, and tools/list returns [list_subjects, search] over HTTP.
server = [
    "fastmcp==2.14.7",                  # MCP server (streamable-http) + @mcp.tool
    "uvicorn[standard]==0.49.0",        # ASGI server for MCP + REST mirror
]

# The onnxruntime BUILD, chosen per image, never both (plan §8 3b item 2): the two
# install the same `onnxruntime` package dir, and with both present whichever went in
# last runs while the other's metadata says otherwise (ort_session.py refuses that).
#   cpu  the worker and the CPU server (INT8 on the Mac mini; RapidOCR's runtime too)
#   gpu  the EC2 server: CUDA 13 + cuDNN 9 as nvidia-* wheels via the extras
#        (tools/onnx-export/FINDINGS.md finding 1). Same version as cpu, always.
cpu = ["onnxruntime==1.30.0"]
gpu = ["onnxruntime-gpu[cuda,cudnn]==1.30.0"]

# Tooling only: tools/onnx-export/ (a NEW model export, e.g. the GPU fp16 reranker).
# Not used to build the images — their models come from the frozen models image.
export = ["onnx>=1.17"]

[project.scripts]
ingest = "docs_bridge.cli:main"
docs-bridge-server = "docs_bridge.server:serve"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
