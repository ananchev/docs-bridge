    kind: fact
    source: sampled
    status: draft
    expect:
      - {doc: "Siemens/Teamcenter 2512/Teamcenter Gateway for SAP Business Suite - Configuration Guide.pdf", contains: "leading zeros"}
    evidence: "the result might not show MMs with IDs containing only numbers if the ID search string does not start with an asterisk (*) because of the leading zeros in the internal SAP number format"

