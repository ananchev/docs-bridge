# Labelled question set — the Mac mini's `teamcenter` corpus (Gate 2, plan §1.1/§5.2).
#
# Used by tools/eval/retrieval_ab.py (old vs new image on the same collection) and
# embedded by tools/eval/embed_upgrade_parity.py (queries take part in the embed
# parity gate). Drafted 2026-09-28 from real chunks of the live collection; every
# label needs a human check before results from it are trusted.
#
# SCHEMA
#   id        stable id; never reuse one
#   question  as a user would type it
#   kind      fact | procedure | identifier | control
#   expect    the chunks that ANSWER it. A retrieved chunk is a hit when it matches
#             ANY entry: doc_id equal to `doc`, AND `section` a substring of its
#             section_path (if given), AND `contains` a substring of its text (if
#             given; case-insensitive). Labels are content, not chunk ids, so they
#             survive re-chunking.
#             Empty for `control`: those must ABSTAIN (best rerank score < 0).
#   evidence  a short quote of the answering text, for whoever verifies the label
#   status    draft -> verified (a human read the chunk and agrees) | drop
#   source    sampled (drafted from a random chunk) | gate1-fixture (the §2.2 queries)
#
# The T4S and T4EA guides carry many identical passages; where they do, both
# documents are listed so either counts.

version: 1
corpus: teamcenter
questions:

  # --- the Gate 1 fixture queries (real questions, labels from their best chunks) ---
  - id: tc-001
    question: How do we read properties of a Teamcenter relation?
    kind: procedure
    source: gate1-fixture
    status: draft
    expect:
      - {doc: "Siemens/Teamcenter 2512/Teamcenter Gateway for Enterprise Applications - Basic Configuration Guide.pdf", contains: "properties directly on the relation objects"}
      - {doc: "Siemens/Teamcenter 2512/Teamcenter Gateway for SAP Business Suite - Basic Configuration Guide.pdf", contains: "properties directly on the relation objects"}
    evidence: "Since the Teamcenter version 10 it is possible to define properties directly on the relation objects ... T4x supports"

  - id: tc-002
    question: How to read BOM data from Teamcenter in AIG
    kind: procedure
    source: gate1-fixture
    status: draft
    expect:
      - {doc: "Siemens/Teamcenter 2512/Teamcenter Gateway for SAP Business Suite - Basic Configuration Guide.pdf", contains: "IndexedFieldMapping"}
      - {doc: "Siemens/Teamcenter 2512/Teamcenter Gateway for Enterprise Applications - Basic Configuration Guide.pdf", contains: "IndexedFieldMapping"}
    evidence: "The function ::T4X::TC::MAPPING::IndexedFieldMapping is used to read the structured data from Teamcenter."

  - id: tc-003
    question: How to send an email from T4X?
    kind: procedure
    source: gate1-fixture
    status: draft
    expect:
      - {doc: "Siemens/Teamcenter 2512/Teamcenter Gateway for Enterprise Applications - Basic Configuration Guide.pdf", contains: "DEFAULT_SMTP"}
      - {doc: "Siemens/Teamcenter 2512/Teamcenter Gateway for SAP Business Suite - Basic Configuration Guide.pdf", contains: "DEFAULT_SMTP"}
    evidence: "For T4x functionality of sending an email ... the communication channel DEFAULT_SMTP is required"

  - id: tc-004
    question: How does SAP distinguish if a BOM line was created in SAP or via an external system?
    kind: fact
    source: gate1-fixture
    status: draft
    expect:
      - {doc: "Siemens/Teamcenter 2512/Teamcenter Gateway for SAP Business Suite - Configuration Guide.pdf", section: "CAD Indicator"}
    evidence: "If a BOM is created or modified in the SAP GUI and then modified again by T4S, you may find duplicated lines ... the SAP \"CAD Indicator\""

  - id: tc-005
    question: How do we update basic unit of measure in SAP?
    kind: procedure
    source: gate1-fixture
    status: draft
    expect:
      - {doc: "Siemens/Teamcenter 2512/Teamcenter Gateway for SAP Business Suite - Configuration Guide.pdf", section: "Basic Unit of Measure"}
    evidence: "The basic unit of measure is a required SAP attribute for the Material Master. It can be changed as long as there are no orders for that material in SAP."

  - id: tc-006
    question: TC_transfer_area site preference
    kind: identifier
    source: gate1-fixture
    status: draft
    expect:
      - {doc: "Siemens/Teamcenter 2512/Multi-Site Collaboration.pdf", contains: "TC_transfer_area="}
      - {doc: "Siemens/Teamcenter 2512/Teamcenter Gateway for SAP Business Suite - Basic Configuration Guide.pdf", contains: "TC_transfer_area preference"}
      - {doc: "Siemens/Teamcenter 2512/Teamcenter Gateway for Enterprise Applications - Basic Configuration Guide.pdf", contains: "TC_transfer_area preference"}
    evidence: "Full OS path to the directory ... TC_transfer_area=/tmp (Multi-Site 'Valid Values'); the T4x guides describe how its values are tried in turn"

  - id: tc-007
    question: EPM_attach_related_objects
    kind: identifier
    source: gate1-fixture
    status: draft
    expect:
      - {doc: "Siemens/Teamcenter 2512/Workflow Handlers.pdf", section: "EPM-attach-related-objects"}
      - {doc: "Siemens/Teamcenter 2512/Workflow Designer on Rich Client.pdf", section: "EPM-attach-related-objects"}
    evidence: "EPM-attach-related-objects { -relation= <relation-name> | -property= <property-name> } [-include_related_type= ...] (the handler's own reference section; the name alone appears in ~55 chunks that only mention it)"

  # --- sampled from the guides ------------------------------------------------------
  - id: tc-008
    question: If SSO is enabled, how are the -u and -p arguments of Teamcenter utilities authenticated?
    kind: fact
    source: sampled
    status: draft
    expect:
      - {doc: "Siemens/Teamcenter 2512/Teamcenter Utilities.pdf", contains: "authenticated externally through SSO"}
    evidence: "If Security Services single sign-on (SSO) is enabled ... the -u and -p arguments are authenticated externally through SSO rather than ... against the Teamcenter database."
    # this note is repeated verbatim under every utility (~290 chunks): any of them is a correct answer

  - id: tc-009
    question: Which EPM-notify recipient sends email only to the users who have not yet made their decision on the task?
    kind: identifier
    source: sampled
    status: draft
    expect:
      - {doc: "Siemens/Teamcenter 2512/Workflow Handlers.pdf", contains: "have not set the decision"}
    evidence: "$UNDECIDED — Sends email to the users who have not set the decision for the task."

